spring.application.name=backend
server.port=8080

# Persistent H2 Database
spring.datasource.url=jdbc:h2:file:./data/devflowxdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.path=/h2-console

# Security (Google OAuth - Replace with your real keys in environment variables)
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email


# JWT Secret
devflowx.jwt.secret=9a4f2c8d3e1f0g7h6i5j4k3l2m1n0o9p8q7r6s5t4u3v2w1x0y9z8a7b6c5d4e3f
devflowx.jwt.expiration=86400000

# Mail Configuration (Mock/Local for now)
